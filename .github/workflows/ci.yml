name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"
      - name: Load each skill and check index.json
        run: deno run --allow-read=. --allow-run=deno scripts/build-index.js --check
      - name: Test
        run: deno test --allow-env tests/
